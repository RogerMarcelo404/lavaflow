{% load static %}<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · LavaFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'core/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="lf-login d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-droplet-half fs-1" style="color: var(--lf-primaria);"></i>
                <h1 class="h3 fw-bold mb-1">LavaFlow</h1>
                <p class="text-secondary mb-0">Gestão de lava-jato e estética automotiva</p>
            </div>

            {% if erro %}
            <div class="alert alert-danger py-2">{{ erro }}</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}"
                           placeholder="seu@email.com" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>
                <button type="submit" class="btn btn-lf w-100 py-2">Entrar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
